<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U-Speak としょかん（外がわ と 中）</title>
<style>
  body{margin:0;background:#fffaf0;color:#17332a;font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif}
  h1{margin:0;padding:18px 28px 6px;font-size:24px}
  h2{margin:0;padding:14px 28px 6px;font-size:17px}
  p{margin:0;padding:0 28px 8px;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 28px 14px;max-width:1960px}
  figure{margin:0}
  figure canvas{display:block;width:100%;border-radius:14px;background:#10261d}
  figcaption{font-size:13px;padding:4px 2px}
</style>
</head>
<body>
<h1>としょかん（れんがの 図書館）</h1>
<p id="info">…</p>
<h2>外がわ（ひる・よる）</h2>
<div class="grid" id="ext"></div>
<h2>中（ゲームと 同じ 上からの カメラ・目の 高さ）</h2>
<div class="grid" id="int"></div>
<script type="module">
import * as THREE from './three.module.js';
import { buildLibraryExterior } from './library-real.js';
import { buildChibiAvatar } from './avatar-chibi.js';

const q = new URLSearchParams(location.search), only = q.get('only'), W = +(q.get('w') || 1100), H = +(q.get('h') || 680);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const stats = {};
function shot(host, id, title, scene, pos, look, fov = 43) {
  if (only && !only.split(',').some((k) => id.startsWith(k))) return;
  const camera = new THREE.PerspectiveCamera(fov, W / H, 0.1, 400); camera.position.set(...pos); camera.lookAt(...look);
  renderer.info.reset(); renderer.render(scene, camera);
  const c = document.createElement('canvas'); c.width = W; c.height = H; c.id = id; c.getContext('2d').drawImage(renderer.domElement, 0, 0);
  const f = document.createElement('figure'), cap = document.createElement('figcaption');
  stats[id] = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
  cap.textContent = `${title} — ${stats[id].calls} かい・${stats[id].tris} まい`;
  f.append(c, cap); document.querySelector(host).append(f);
}
const noa = (x, z, ry = 0, y = 0) => { const a = buildChibiAvatar('noa'); a.position.set(x, y, z); a.rotation.y = ry; a.traverse((m) => { if (m.isMesh) m.castShadow = true; }); return a; };

// ── 外がわ：島と 同じ 光（半球＋太陽 1 つ・ACES）。草の 地面と、くらべる ための ふつうの 家の 大きさの 箱（8×7）。──
{
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbad9df); scene.fog = new THREE.FogExp2(0xc5dedb, 0.006);
  const hemi = new THREE.HemisphereLight(0xe5f6ff, 0x818954, 2.1); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffe8b5, 3.2); sun.position.set(-35, 55, 40); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, far: 160 }); sun.shadow.bias = -0.0005; scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshStandardMaterial({ color: 0x79b356, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05; ground.receiveShadow = true; scene.add(ground);
  const lib = buildLibraryExterior(); scene.add(lib.group);
  scene.add(noa(1.2, lib.door.z + 0.5, 0, lib.steps.h)); scene.add(noa(-6, 13));
  const house = new THREE.Mesh(new THREE.BoxGeometry(8, 7, 7), new THREE.MeshStandardMaterial({ color: 0xf0e6d0, roughness: 0.9 })); house.position.set(27, 3.5, 2); house.castShadow = true; scene.add(house);
  for (const o of q.get('boxes') ? lib.obstacles : []) { const m = new THREE.Mesh(new THREE.BoxGeometry(o.w * 2, 0.3, o.d * 2), new THREE.MeshBasicMaterial({ color: 0xff3355, wireframe: true })); m.position.set(o.x, 0.2, o.z); scene.add(m); }
  shot('#ext', 'ext-front', 'まえ ななめ（ひる）', scene, [-26, 15, 42], [1, 6.5, 0]);
  shot('#ext', 'ext-game', 'ゲームの カメラ（プレイヤーの うしろ 上から）', scene, [0, 19, 44], [0, 4, 6], 43);
  shot('#ext', 'ext-face', 'ましょうめん', scene, [0, 8, 40], [0, 8.5, 0], 40);
  shot('#ext', 'ext-near', '入り口の ちかく', scene, [7, 4.5, 17], [-1, 6, 4], 50);
  shot('#ext', 'ext-side', 'よこ', scene, [44, 12, 10], [0, 6, -1]);
  shot('#ext', 'ext-top', 'うえ', scene, [0, 62, 12], [0, 0, 1], 40);
  shot('#ext', 'ext-back', 'うしろ ななめ', scene, [28, 16, -36], [0, 6, 0]);
  // よる：光を 落として、まどを 灯す（island-kit の setNight と 同じ：emissiveIntensity = glow × n）。
  hemi.intensity = 0.85; sun.intensity = 1.0; sun.color.set(0x9db4e8); scene.background.set(0x10203a); scene.fog.color.set(0x10203a); renderer.toneMappingExposure = 1.08;
  for (const { material, glow } of lib.lit) material.emissiveIntensity = glow * 1;
  shot('#ext', 'ext-night', 'まえ ななめ（よる・まどが 灯る）', scene, [-26, 15, 42], [1, 6.5, 0]);
  for (const { material } of lib.lit) material.emissiveIntensity = 0;
  renderer.toneMappingExposure = 1.18;
  stats.exterior = { tris: lib.tris, meshes: lib.group.children.length, height: lib.height };
}

// ── 中：みんなの 部屋（island-interior.js）と 同じ 光。──
if (!only || only.includes('int')) {
  const { buildLibraryInterior } = await import('./library-interior.js');
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x08160f);
  scene.add(new THREE.HemisphereLight(0xfff6e8, 0x2f6b55, 1.9));
  const sun = new THREE.DirectionalLight(0xfff4e0, 1.35); sun.position.set(5, 12, 7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, far: 80 }); sun.shadow.bias = -0.0008; scene.add(sun);
  const lib = buildLibraryInterior(); scene.add(lib.group); lib.update(1.3);
  const kid = noa(lib.spawn.x, lib.spawn.z, Math.PI); scene.add(kid);
  const marks = new THREE.Group(); scene.add(marks);
  if (q.get('boxes')) {
    for (const o of lib.obstacles) { const m = new THREE.Mesh(new THREE.BoxGeometry(o.w * 2, 0.2, o.d * 2), new THREE.MeshBasicMaterial({ color: 0xff3355, wireframe: true })); m.position.set(o.x, 0.15, o.z); marks.add(m); }
    for (const s of lib.spots) { const m = new THREE.Mesh(new THREE.RingGeometry(s.r - 0.08, s.r, 32), new THREE.MeshBasicMaterial({ color: 0x40ffb0 })); m.rotation.x = -Math.PI / 2; m.position.set(s.x, 0.12, s.z); marks.add(m); }
  }
  // ゲームの カメラ：プレイヤーの うしろ 上から（island-interior.js の 式：きょり 17・高さ 1.2＋きょり×0.8）。
  const chase = (id, title, x, z, dist = 17) => { kid.position.set(x, 0, z); shot('#int', id, title, scene, [x, 1.2 + dist * 0.8, z + dist], [x, 1.1, z - 1]); };
  chase('int-chase', '上からの カメラ（入って すぐ）', lib.spawn.x, lib.spawn.z);
  chase('int-centre', '上からの カメラ（まんなか）', 0, 1);
  const books = lib.spots.find((s) => s.id === 'books'), study = lib.spots.find((s) => s.id === 'study1');
  chase('int-reading', '上からの カメラ（としょしつ）', books.x, books.z, 14);
  chase('int-study', '上からの カメラ（じしゅうしつ）', study.x, study.z + 1.5, 14);
  shot('#int', 'int-map', 'まうえ（当たり判定を 見る とき ?boxes=1）', scene, [0, 62, 6], [0, 0, 2.5], 44);
  // 目の 高さ：てんじょうと 南の かべも 出す（一人称の とき）。
  if (lib.group.userData.ceiling) lib.group.userData.ceiling.visible = true;
  kid.position.set(2, 0, 3);
  shot('#int', 'int-eye1', '目の 高さ（入り口から 北を 見る）', scene, [0, 2.3, 11.2], [0, 5.2, -6], 68);
  shot('#int', 'int-eye2', '目の 高さ（まんなかから 西の としょしつ）', scene, [6.5, 2.4, 4.5], [-13, 3.6, -2.5], 68);
  shot('#int', 'int-eye3', '目の 高さ（じしゅうしつ）', scene, [14.6, 2.4, 4.6], [22, 1.6, -4], 68);
  shot('#int', 'int-eye4', '見あげる（てんじょうと シャンデリア）', scene, [0, 1.8, 9], [0, 11, -3], 75);
  stats.interior = { tris: lib.tris, meshes: lib.group.children.length, spots: lib.spots, spawn: lib.spawn, exit: lib.exit };
}
document.querySelector('#info').textContent = `外がわ：${stats.exterior?.tris} まい・${stats.exterior?.meshes} メッシュ ／ 中：${stats.interior?.tris ?? '-'} まい・${stats.interior?.meshes ?? '-'} メッシュ`;
document.body.dataset.stats = JSON.stringify(stats);
document.body.dataset.ready = '1';
</script>
</body>
</html>
