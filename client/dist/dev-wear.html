<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U-Speak きせかえの 品（見た目の たしかめ）</title>
<style>
  body{margin:0;background:#0c241c;color:#fff4d6;font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif}
  h1{margin:0;padding:18px 22px 4px;font-size:24px}
  h1 small{font-size:13px;color:#8ff0c8;font-weight:500;margin-left:10px}
  h2{margin:0;padding:14px 22px 6px;font-size:18px;color:#ffb066}
  .grid{display:grid;grid-template-columns:repeat(var(--cols,8),1fr);gap:8px;padding:0 22px 14px}
  .card{background:#14332a;border:1px solid #2f5a48;border-radius:12px;overflow:hidden;position:relative}
  .card img.main{display:block;width:100%}
  .card img.icon{position:absolute;right:5px;top:5px;width:30%;border-radius:8px;background:#f4efe2;border:1px solid #fff4d6}
  .txt{padding:4px 8px 7px;font-size:12px;line-height:1.35}
  .txt b{color:#ffb066}
  .txt i{font-style:normal;color:#8ff0c8;font-size:11px}
</style>
</head>
<body>
<h1>きせかえの 品 <small>?slot=hat|face|back|chest ・ ?body=kai|k-rabbit|mia… ・ ?all=1（色ちがいも）・ ?only=cap,crown ・ ?view=front|back|side ・ ?cols=8</small></h1>
<div id="out"></div>
<script type="module">
// きせかえの 品を 体に きせて 1 まいずつ 絵に する（見た目の たしかめ用）。右上は お店の カードと 同じ 向きの 品だけの 絵。
import * as THREE from './three.module.js';
import { buildChibiAvatar } from './avatar-chibi.js';
import { dressAvatar } from './avatars.js';
import { itemModel } from './wardrobe-models.js';
const q = new URLSearchParams(location.search);
const data = await (await fetch('./wardrobe.json')).json();
const bodies = (q.get('body') || 'kai,k-rabbit').split(',');
const slots = (q.get('slot') || 'hat,face,back,chest').split(',');
const only = q.get('only')?.split(',');
const W = 300, H = 330;
document.getElementById('out').style.setProperty('--cols', q.get('cols') || 8);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const lights = (scene) => {
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6b7d88, 1.7));
  const sun = new THREE.DirectionalLight(0xfff2dc, 2.2); sun.position.set(3, 6, 5); sun.castShadow = true; sun.shadow.mapSize.set(512, 512);
  Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 4, bottom: -1, near: 1, far: 20 }); sun.shadow.bias = -0.002; scene.add(sun);
};
const VIEW = { hat: [[1.2, 2.7, 6.6], [0, 2.2, 0], 26], face: [[0.7, 1.9, 4.2], [0, 1.7, 0], 22], chest: [[0.8, 1.4, 5.0], [0, 1.15, 0], 24], back: [[-2.3, 1.9, -5.0], [0.15, 1.2, 0], 30] };
const ALT = { front: [[0.9, 1.9, 7.2], [0, 1.35, 0], 26], back: [[-2.6, 2.0, -6.2], [0.1, 1.3, 0], 30], side: [[6.5, 1.8, 0.6], [0, 1.4, 0], 26] };
function shot(item, bodyId) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fd3c7); lights(scene);
  const model = buildChibiAvatar(bodyId); dressAvatar(model, [item], itemModel); scene.add(model);
  const [pos, look, fov] = ALT[q.get('view')] || VIEW[item.slot];
  const cam = new THREE.PerspectiveCamera(fov, W / H, 0.1, 50); cam.position.set(...pos); cam.lookAt(...look);
  renderer.render(scene, cam); return renderer.domElement.toDataURL('image/jpeg', 0.9);
}
function icon(item) {           // お店の bake と 同じ 向き・同じ 光
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6b7d88, 2.5)); const key = new THREE.DirectionalLight(0xfff3dc, 2.7); key.position.set(-2.4, 3.2, 4); scene.add(key);
  const model = itemModel(item); if (!model) return '';
  model.rotation.set(0.1, -0.52, 0); model.updateMatrixWorld(true); scene.add(model);
  const b = new THREE.Box3().setFromObject(model), size = b.getSize(new THREE.Vector3()), mid = b.getCenter(new THREE.Vector3()), away = Math.max(size.x, size.y, size.z, 0.2) * 2.5;
  const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 24); cam.position.set(mid.x + away * 0.5, mid.y + away * 0.42, mid.z + away * 0.88); cam.lookAt(mid);
  renderer.setSize(132, 132); renderer.setClearColor(0, 0); renderer.render(scene, cam); const url = renderer.domElement.toDataURL('image/png'); renderer.setSize(W, H); return url;
}
for (const slot of slots) {
  const seen = new Set();
  const items = data.items.filter((i) => i.slot === slot && (!only || only.includes(i.kind)) && (q.get('all') || (!seen.has(i.kind) && seen.add(i.kind))));
  for (const bodyId of bodies) {
    const h = document.createElement('h2'); h.textContent = `${slot} ・ ${bodyId} ・ ${items.length}`; document.getElementById('out').append(h);
    const grid = document.createElement('div'); grid.className = 'grid'; document.getElementById('out').append(grid);
    for (const item of items) {
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = `<img class="main" src="${shot(item, bodyId)}"><img class="icon" src="${icon(item)}"><div class="txt"><b>${item.kind}</b> <i>${item.id} ・ ${item.price}</i></div>`;
      grid.append(card);
    }
  }
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
