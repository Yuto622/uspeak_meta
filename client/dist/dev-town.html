<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U-Speak まちづくり島の 商品（ブロック・かぐ）</title>
<style>
  body{margin:0;background:#fffaf0;color:#17332a;font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif}
  h1{margin:0;padding:18px 28px 6px;font-size:24px}
  h2{margin:0;padding:14px 28px 6px;font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 28px 12px;max-width:1240px}
  .card{background:#fff;border:2px solid #efe6d2;border-radius:16px;text-align:center;padding:10px 6px 12px}
  .card img.big{width:128px;height:128px}
  .card img.small{width:46px;height:46px;vertical-align:middle}
  .card b{display:block;font-size:15px}
  canvas.stage{display:block;margin:0 28px 14px;border-radius:16px;width:1180px;height:520px;max-width:calc(100% - 56px)}
</style>
</head>
<body>
<h1>まちづくり島の 商品</h1>
<h2>ブロック屋の カードの 絵（2D・大きい＝128px／小さい＝お店と 同じ 46px）</h2>
<div class="grid" id="icons"></div>
<h2>ひろばの ブロック（3D）</h2>
<canvas class="stage" id="blocks" width="1180" height="520"></canvas>
<h2>かぐ屋の カードの 絵</h2>
<div class="grid" id="shots"></div>
<h2>マイルームの かぐ（3D・むき 0〜3）</h2>
<canvas class="stage" id="room" width="1180" height="520"></canvas>
<canvas class="stage" id="room2" width="1180" height="520"></canvas>
<script type="module">
import * as THREE from './three.module.js';
import { blockIcon } from './town-block-icon.js';
import { blockGeometry, blockMaterial } from './town-real.js';
import { furnitureModel, furnitureShots, furnitureShot } from './furniture-real.js';
import { fullFurniture, FURNITURE_DESIGNS, FURNITURE_STYLES } from './furniture-data.js';

const town = await (await fetch('./town.json')).json();
const Q = new URLSearchParams(location.search);
const only = Q.get('only');
const ALL = fullFurniture(town.furniture), BY = new Map(ALL.map((f) => [f.id, f]));

// ---- 1000 しゅるいの 見本（2026-11 の おわり）----
// ?sheet=designs&style=pine   … 形 50 を 1 つずつ（その スタイルで）
// ?sheet=styles&design=sofa   … 1 つの 形を 24 の スタイル ぜんぶで
// ?sheet=room&design=sofa     … へやと 同じ 光で 3D（スタイル ぜんぶ）／ ?sheet=room&style=pink … 形 ぜんぶ
// sheet が あれば 見本だけを 出す（下の 前からの 一覧は 出さない）。
if (Q.get('sheet')) {
  for (const el of [...document.body.children]) if (el.tagName !== 'SCRIPT') el.remove();
  const sheet = Q.get('sheet'), style = Q.get('style') || 'pine', design = Q.get('design') || 'sofa';
  const list = Q.get('design') || sheet === 'styles' ? FURNITURE_STYLES.map((s) => BY.get(`${design}-${s.id}`)) : FURNITURE_DESIGNS.map((d) => BY.get(`${d.id}-${style}`));
  const h = document.createElement('h1'); h.textContent = sheet === 'styles' || Q.get('design') ? `${design} × スタイル ${FURNITURE_STYLES.length}` : `形 ${FURNITURE_DESIGNS.length} × ${style}`; document.body.append(h);
  if (sheet !== 'room') {
    const grid = document.createElement('div'); grid.className = 'grid'; grid.style.gridTemplateColumns = 'repeat(auto-fill,minmax(138px,1fr))'; document.body.append(grid);
    for (const f of list) {
      const d = document.createElement('div'); d.className = 'card';
      const url = await furnitureShot(f);
      d.innerHTML = `${url ? `<img class="big" src="${url}" alt="">` : '<b>（かけない）</b>'}<b>${f.word}</b><small>${f.ja}・◈${f.price}</small>`;
      grid.append(d);
    }
  } else {
    const rep = [];
    for (let i = 0; i < list.length; i += 8) {
      const canvas = document.createElement('canvas'); canvas.className = 'stage'; canvas.width = 1180; canvas.height = 520; document.body.append(canvas);
      const row = list.slice(i, i + 8), total = row.reduce((n, f) => n + f.w + 0.7, -0.7);
      const S = stage(canvas, [0, 4.4, Math.max(9.8, total * 0.72)], [0, 0.95, 0]);
      let x = -total / 2;
      for (const f of row) { rep.push(place(S, f, Math.round(x), -Math.floor(f.d / 2), 0)); x += f.w + 0.7; }
      S.draw();
    }
    document.body.dataset.report = JSON.stringify(rep);
  }
  document.body.dataset.ready = '1';
  await new Promise(() => {});   // 下の 前からの 一覧は 出さない
}

// 1. カードの 絵。
for (const b of town.blocks) {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<img class="big" src="${blockIcon(b.id, b.color, 128)}" alt=""> <img class="small" src="${blockIcon(b.id, b.color)}" alt=""><b>${b.id}</b>`;
  document.querySelector('#icons').append(d);
}

// へやと ひろばと 同じ 光（半球＋太陽 1 つ）。
function stage(canvas, cam, look) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(canvas.width, canvas.height, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x10261d);
  scene.add(new THREE.HemisphereLight(0xfff6e8, 0x2f6b55, 2.0));
  const sun = new THREE.DirectionalLight(0xfff0d0, 1.5); sun.position.set(6, 14, 8); sun.castShadow = true;
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 }); sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x1b4a39, roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const camera = new THREE.PerspectiveCamera(38, canvas.width / canvas.height, 0.1, 200);
  camera.position.set(...cam); camera.lookAt(...look);
  return { renderer, scene, camera, draw: () => { renderer.render(scene, camera); return renderer.info.render.calls; } };
}

// 2. ブロック：1 こずつ ならべ、うしろに つんだ かべ。
{
  const S = stage(document.querySelector('#blocks'), [0, 5.2, 11], [0, 1.1, 0]);
  const put = (b, x, y, z) => { const m = new THREE.Mesh(blockGeometry(), blockMaterial(b.id, b.color)); m.position.set(x, y + 0.5, z); m.castShadow = m.receiveShadow = true; S.scene.add(m); };
  town.blocks.forEach((b, i) => {
    const x = (i - (town.blocks.length - 1) / 2) * 1.7;
    put(b, x, 0, 2.5);
    for (let k = 0; k < 2; k += 1) for (let y = 0; y < 3 - k; y += 1) put(b, x + k * 0, y, -1 - k);
  });
  document.body.dataset.blockCalls = S.draw();
}

// 3. かぐ屋の カードの 絵。
const shots = await furnitureShots(town.furniture);
for (const f of town.furniture) {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = shots?.[f.id] ? `<img class="big" src="${shots[f.id]}" alt=""><b>${f.id}（${f.w}×${f.d}）</b>` : `<b>${f.id}（かけない）</b>`;
  document.querySelector('#shots').append(d);
}

// 4. へやの 中と 同じ 置きかた：しめる マスを 黄色い わくで 見せる（モデルが わくの 中に おさまって いるか）。
function place(S, f, ax, az, r) {
  const w = r % 2 ? f.d : f.w, d = r % 2 ? f.w : f.d;
  const g = new THREE.Group(); const m = furnitureModel(f); m.rotation.y = r * Math.PI / 2; g.add(m);
  g.position.set(ax + w / 2 - 0.5, 0, az + d / 2 - 0.5); S.scene.add(g);
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, 0.02, d)), new THREE.LineBasicMaterial({ color: 0xffe08a }));
  edge.position.set(g.position.x, 0.02, g.position.z); S.scene.add(edge);
  const box = new THREE.Box3().setFromObject(g);
  const out = box.min.x < g.position.x - w / 2 - 0.001 || box.max.x > g.position.x + w / 2 + 0.001 || box.min.z < g.position.z - d / 2 - 0.001 || box.max.z > g.position.z + d / 2 + 0.001 || box.min.y < -0.001;
  return { id: f.id, r, out, h: +box.max.y.toFixed(2) };
}
const report = [];
{
  // 8 こずつ 1 まいの 絵に（31 しゅるい ぜんぶ）。はじめの 1 まいは もとの canvas、のこりは 足す。
  const list = town.furniture.filter((f) => !only || f.id === only);
  let calls = 0, first = document.querySelector('#room'), last = first;
  for (let i = 0; i < list.length; i += 8) {
    let canvas = first;
    if (i) { canvas = document.createElement('canvas'); canvas.className = 'stage'; canvas.width = 1180; canvas.height = 520; last.after(canvas); last = canvas; }
    const row = list.slice(i, i + 8), total = row.reduce((n, f) => n + f.w + 0.7, -0.7);
    const S = stage(canvas, [0, 4.4, 9.8], [0, 0.95, 0]);
    let x = -total / 2;
    for (const f of row) { report.push(place(S, f, Math.round(x), -Math.floor(f.d / 2), 0)); x += f.w + 0.7; }
    calls += S.draw();
  }
  document.body.dataset.roomCalls = calls;
}
{
  const S = stage(document.querySelector('#room2'), [0, 9.5, 10.5], [0, 0.4, 0]);
  const f = (id) => town.furniture.find((q) => q.id === id);
  let x = -11;
  for (const id of ['bed', 'pc', 'bed_canopy', 'bed_king']) for (const r of [1, 2, 3]) { const it = f(id), w = r % 2 ? it.d : it.w; report.push(place(S, it, x, -1, r)); x += w + 0.4; }
  S.draw();
}
document.body.dataset.report = JSON.stringify(report);
document.body.dataset.ready = '1';
</script>
</body>
</html>
