# 保護者レポートの TeX worker（README「TeX の 実行環境」）。本体からだけ 呼ぶ：公開の http_service は 持たない。
#   fly apps create uspeak-report-worker
#   fly secrets set -a uspeak-report-worker RENDER_SECRET=<本体と 同じ 値>
#   fly deploy -c worker/fly.toml            （リポジトリの いちばん上で）
#   fly ips allocate-v6 --private -a uspeak-report-worker
# 本体には RENDER_URL=http://uspeak-report-worker.flycast/render を 設定（fly secrets set -a uspeak-multiplayer）。
# Flycast なので、使わない 間は 止まり（auto_stop）、呼ばれたら 起きる（配信は 週に 1 回）。
app = "uspeak-report-worker"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
