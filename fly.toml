# Fly.io configuration: Tokyo region, always-on (no idle sleep), HTTPS/WSS only.
# Deploy: fly launch --copy-config --no-deploy && fly secrets set ... && fly deploy
app = "uspeak-multiplayer"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "2567"
  # Players per class room. Raise to 100 for a whole-school event in one world.
  MAX_CLIENTS = "30"
  PATCH_RATE_MS = "100"
  RECONNECT_GRACE_SEC = "60"
  STORE_FLUSH_MS = "5000"
  SERVE_CLIENT = "true"
  # Must match the public URL of this app (used for CORS and WebSocket origin checks).
  CORS_ORIGINS = "https://uspeak-multiplayer.fly.dev"

[http_service]
  internal_port = 2567
  force_https = true
  # Never stop the machine on idle: the first connection of a lesson must not wait for a cold start.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    # Each player = 1 WebSocket (+ short-lived HTTP for assets). Sized for 100+ concurrent players.
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  # 100 concurrent players measured at ~10% of one core and ~200 MB RSS; 1 GB leaves headroom.
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  # A single machine keeps every class in one process (rooms are in-memory).
  strategy = "immediate"
