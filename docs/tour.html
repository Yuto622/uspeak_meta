<script>
const DATA = {"full": [{"chapter": "はじめに", "fig": "island-willow", "title": "U-Speak ウェブ版", "text": "U-Speak ウェブ版へようこそ。子どもたちが英語を使って歩きまわる、３Ｄの世界です。いま U-Speak Roblox をお使いの教室さまに向けて、何ができて、Roblox 版と何が違うのかを、実際の画面でご覧いただきます。", "sec": 23.3, "at": 0.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/90ecffbc11633ffe.wav", "spoken": 21.98, "frames": 233}, {"chapter": "はじめに", "fig": "screen-map", "title": "インストールも アカウントも いりません", "text": "いちばん大きな違いは、はじめかたです。ブラウザで教室のＵＲＬを開き、名前とクラスコードを入れるだけ。アプリのインストールも、アカウントの管理もありません。教室の iPad で、そのまま授業が始められます。", "sec": 17.4, "at": 23.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/231239fe69f47e4d.wav", "spoken": 16.07, "frames": 174}, {"chapter": "はじめに", "fig": "screen-map", "title": "１４の島", "text": "世界には１４の島があります。行き先を選んで飛ぶだけで、島に順番はありません。今日やりたい島へ、まっすぐ行けます。先生は、クラス全員を一度に同じ島へ動かすこともできます。", "sec": 15.1, "at": 40.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/272824e96955cd4e.wav", "spoken": 13.72, "frames": 151}, {"chapter": "学習の島", "fig": "island-school", "title": "ことばの学校島", "text": "ことばの学校島です。やさしい小屋、ふつうの小屋、むずかしい小屋。小屋に入ることが、そのまま難易度を選ぶことになります。", "sec": 11.1, "at": 55.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/cc5ce9b759b8f6e8.wav", "spoken": 9.73, "frames": 111}, {"chapter": "学習の島", "fig": "screen-quiz", "title": "単語クイズ ・ １,５０１問", "text": "中に入ると、四択の単語クイズが十問。全部で千五百一問あります。まちがえた問題は、あとでもう一度出てきます。大事なのは、この問題文がブラウザに渡っていないことです。子どもの画面に届くのは、いま出ている一問だけ。答え合わせもサーバーが行います。ページの中を覗いて答えを先に読むことはできません。", "sec": 24.7, "at": 66.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/c43f87af390e3766.wav", "spoken": 23.33, "frames": 247}, {"chapter": "学習の島", "fig": "screen-gym", "title": "ことばのジム ・ 聞いて、声に出す", "text": "同じ島のことばのジムでは、聞こえた英語を選び、自分でも声に出して言います。発音は端末のマイクで拾いますが、合っているかどうかを決めるのはサーバーです。", "sec": 12.4, "at": 91.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/9e7880392aa994d5.wav", "spoken": 11.1, "frames": 124}, {"chapter": "学習の島", "fig": "island-arena", "title": "えいごアリーナ島", "text": "えいごアリーナ島。ここでは、攻撃を英語で買います。", "sec": 6.0, "at": 104.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/c146de80dc2e9858.wav", "spoken": 4.23, "frames": 60}, {"chapter": "学習の島", "fig": "screen-battle", "title": "正解が、そのまま攻撃になる", "text": "出題に正解すると、その分だけ相手の体力が削れます。問題は二百四十九問。相手の強さは、入った台で決まります。勝ち負けも、もらえるコインも、決めるのはサーバーです。", "sec": 15.3, "at": 110.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/3974830a3be53646.wav", "spoken": 13.92, "frames": 153}, {"chapter": "英検の島", "fig": "island-eiken5", "title": "英検５級の島", "text": "Roblox 版にはなかった島です。英検の島。五級、四級、三級の三つがあり、建物がそのまま技能になっています。よむ図書館、きく音楽堂、かく工房、はなすステージ。そして、めんせつの間。", "sec": 19.5, "at": 125.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/260797df2e950657.wav", "spoken": 18.16, "frames": 195}, {"chapter": "英検の島", "fig": "screen-eiken", "title": "４技能を、級ごとに", "text": "一つの級につき四十四問。読む十問、聞く十二問、書く十二問、話す十問です。記録は級ごと、技能ごとに分かれて残るので、五級の聞くは九割、書くは六割、という細かさで見られます。", "sec": 17.2, "at": 144.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/43adfb255cfc9891.wav", "spoken": 15.81, "frames": 172}, {"chapter": "英検の島", "fig": "screen-interview", "title": "めんせつの間 ・ 二次試験の練習", "text": "めんせつの間は、二次試験のかたちをそのままなぞります。カードの絵を見て、パッセージを音読し、質問に答え、最後に自分のことを聞かれる。面接官はキャラクターで、待ち時間も本番と同じように進みます。", "sec": 17.0, "at": 162.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/89e9b1bff487aa1e.wav", "spoken": 15.62, "frames": 170}, {"chapter": "AI英会話", "fig": "island-conv", "title": "英会話島", "text": "英会話島では、場所がそのまま場面になります。であいのカフェ、おかいものストリート、がっこうテラス、ゆめのとうだい。入った建物で、話す話題が決まります。", "sec": 13.5, "at": 179.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/84b9b49cc549f137.wav", "spoken": 12.14, "frames": 135}, {"chapter": "AI英会話", "fig": "screen-convtalk", "title": "ウーピーと話す", "text": "相手はキャラクターのウーピー。声で話しても、打ち込んでもかまいません。返事は英語、ヒントは日本語で出ます。右側に出ている目標が、話しながら一つずつ埋まっていきます。話した回数と時間は記録に残りますが、話した文そのものは保護者レポートには載せません。", "sec": 20.4, "at": 192.5, "wav": "/home/user/uspeak_meta/docs/.tour-voice/ed1254c3573e204c.wav", "spoken": 19.07, "frames": 204, "clip": "conv", "from": 12}, {"chapter": "AI英会話", "fig": "island-errand", "title": "おつかい島 ・ 歩いて回るAI英会話", "text": "おつかい島では、同じAI英会話を歩いて回ります。広場で用事を受け取り、その店まで自分で歩いて行って、英語で用事をすませる。店は十か所、おつかいは十五件です。", "sec": 14.4, "at": 212.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/bacf91bda06fad2d.wav", "spoken": 13.05, "frames": 144}, {"chapter": "AI英会話", "fig": "island-talk", "title": "おはなし島 ・ 人どうしが話す", "text": "おはなし島は、AIではなく人どうしが話す島です。部屋に入ることが、そのまま通話に入ること。カメラとマイクはそれぞれ切れますし、文字でも書けるので、声を出しにくい子も参加できます。最大百人まで。朝の会や発表会にもお使いいただけます。", "sec": 20.1, "at": 227.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/c0df6961534e1bcc.wav", "spoken": 18.71, "frames": 201}, {"chapter": "遊びの島", "fig": "screen-fishing", "title": "はじまりの島 ・ 英単語釣り", "text": "はじまりの島には、釣りがあります。魚は百種類。一匹が英単語一つになっていて、釣り場も英検の級で分かれています。釣ること自体が、そのまま単語の練習です。", "sec": 14.3, "at": 247.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/f8b82f313d3725c7.wav", "spoken": 12.92, "frames": 143}, {"chapter": "遊びの島", "fig": "island-ride", "title": "のりもの島", "text": "のりもの島。乗り物は四台あり、買えるのはその乗り物のゲートまで歩いて行ったときだけです。買うと、その乗り物の英単語を一つ覚えます。", "sec": 11.4, "at": 261.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/540da057c826bd14.wav", "spoken": 10.1, "frames": 114}, {"chapter": "遊びの島", "fig": "screen-race", "title": "レース ・ ３周", "text": "スタートラインに立つと、島のコースを三周するレースが始まります。順位もラップもベストタイムも、判定はサーバーです。クラスの誰かと一緒に走れます。", "sec": 12.5, "at": 273.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a442392aa566c0ce.wav", "spoken": 11.13, "frames": 125}, {"chapter": "遊びの島", "fig": "island-town", "title": "まちづくり島", "text": "まちづくり島は、ブロックを買って建てる島です。建てる場所は二つ。自分だけのマイルームと、クラス全員で一つの世界を作るひろば。", "sec": 11.3, "at": 285.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a60e5feb575fb861.wav", "spoken": 9.93, "frames": 113}, {"chapter": "遊びの島", "fig": "screen-plaza", "title": "ひろば ・ クラス全員で一つの世界", "text": "入口に歩いて入るだけで、中に入れます。画面中央の十字でねらって、置く、かたづける、向きを変える。ひろばに積んだブロックは他の子の画面にもその場で現れ、次の授業にも残っています。", "sec": 15.8, "at": 296.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/5fd5763de0747f58.wav", "spoken": 14.43, "frames": 158}, {"chapter": "遊びの島", "fig": "screen-blockshop", "title": "ブロック屋 ・ どれも英単語", "text": "ブロックはブロック屋で買います。き、いし、レンガ、ガラス、ランプ、みず。どれも名前が英単語です。買う前に、立体のかたちと質感でどんなブロックかが見えます。", "sec": 14.4, "at": 312.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/6454cabb0f18aff6.wav", "spoken": 13.02, "frames": 144}, {"chapter": "遊びの島", "fig": "island-wear", "title": "きせかえ島", "text": "きせかえ島。ぼうしや、めがねや、かばんや、アクセサリーや。入った店が、そのまま買えるものになります。", "sec": 9.8, "at": 327.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/126d27d695390530.wav", "spoken": 8.5, "frames": 98}, {"chapter": "遊びの島", "fig": "screen-wearback", "title": "４１点 ・ ３Dで見てから買う", "text": "品物は全部で四十一点。カードの中の品物は三次元で回っていて、買う前に実際どう見えるかがわかります。着たものは、クラス全員の画面に届きます。", "sec": 12.9, "at": 336.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/5be66d9ca22d9068.wav", "spoken": 11.53, "frames": 129}, {"chapter": "同梱ゲーム", "fig": "game-racers", "title": "AURORA KART", "text": "ここからは、まったく別に作られたゲームです。のりもの島に降りると、画面の左下にボタンが出ます。押すと AURORA KART が全画面で始まります。コース四本、グランプリ、タイムアタック、そして英語モード。", "sec": 19.2, "at": 349.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/7c824769cfaea62c.wav", "spoken": 17.87, "frames": 192, "clip": "racers", "from": 21}, {"chapter": "同梱ゲーム", "fig": "game-blockwild", "title": "BLOCKWILD ・ ブロック屋とつながっている", "text": "まちづくり島からは BLOCKWILD。ブロックを積んで世界を作るゲームです。ここが面白いところで、この世界で手に持てるのは、まちづくり島のブロック屋で U-Speak コインを払って買ったブロックだけ。写真の下のバーに、き しか入っていないのは、この子がまだ何も買っていないからです。英語をやってコインを稼ぐと、建てられるものが増えます。", "sec": 28.3, "at": 369.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/1a647e3908327161.wav", "spoken": 26.97, "frames": 283, "clip": "blockwild", "from": 32}, {"chapter": "同梱ゲーム", "fig": "game-suika", "title": "ミニゲーム島", "text": "ミニゲーム島には家が二軒。ぷよと、スイカゲーム。どちらも英単語を使ったパズルです。なお、この四本の同梱ゲームでは、コインも学習の記録も動きません。正誤を判定しているのがそのゲーム自身だからです。遊びの時間として置いてあります。", "sec": 19.0, "at": 397.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/73252deae98dfbfd.wav", "spoken": 17.66, "frames": 190}, {"chapter": "記録", "fig": "screen-dashboard", "title": "マイページ ・ ５技能", "text": "ここからは記録の話です。子ども自身が見るのがマイページ。読む、聞く、書く、話す、語彙の五技能を、やった量と正解率から出しています。", "sec": 12.9, "at": 416.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/c0cc1b97c1bd90e0.wav", "spoken": 11.59, "frames": 129}, {"chapter": "記録", "fig": "report-page1", "title": "保護者レポート ・ A4 ２ページ", "text": "保護者さまへは、先生コンソールのボタン一つで、このＡ４二ページのＰＤＦが出ます。名前、レベル、正解率、やったことの棒グラフ。教室で刷って、そのままお渡しいただけます。", "sec": 16.2, "at": 429.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/51828c67bdd383fd.wav", "spoken": 14.81, "frames": 162}, {"chapter": "記録", "fig": "report-page2", "title": "数字は だれが決めているか", "text": "二ページ目には、全部の記録と、つぎのもくひょう。そして、この数字がどこから来たのかの説明が入ります。書いた文や話した内容は載せません。載せるのは学習の記録だけです。", "sec": 14.6, "at": 445.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/3b3ac47d7b76b085.wav", "spoken": 13.3, "frames": 146}, {"chapter": "記録", "fig": "screen-quiz", "title": "正誤も、コインも、サーバーが決める", "text": "大切な点を一つ。子どもの端末が決めているのは、どこに立っているか、どちらを向いているか、それだけです。正誤、経験値、コイン、購入、持ち物、学習の記録、レベル、順位、先生かどうか。これらは全部サーバーが決めています。保護者さまにお見せする数字は、すべてこちら側から出ています。ブラウザをいじってコインを増やす、正解率を上げる、といったことはできません。", "sec": 31.0, "at": 460.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/cb7a2f1c82796663.wav", "spoken": 29.61, "frames": 310}, {"chapter": "教室での運用", "fig": "screen-teacher", "title": "先生コンソール", "text": "先生コンソールは、講師キーを入れた方にだけ出ます。判定はサーバー側だけで行うので、ブラウザをいじって先生になることはできません。クラス全員をここへ集める、名簿からその子のところへ飛ぶ、チャットを止める、保護者レポートのリンクを配る。授業中に必要なことが、この一枚に集まっています。", "sec": 22.7, "at": 491.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/e5eb9ed90ac396be.wav", "spoken": 21.36, "frames": 227}, {"chapter": "教室での運用", "fig": "island-park", "title": "安全と、人数", "text": "安全についても申し上げておきます。世界の中にお金の入口はありません。Robux にあたるものは作っていません。チャットは定型フレーズが基本で、自由入力もＮＧワード表を通り、先生がいつでも止められます。ＡＩ英会話とビデオ通話には一日の上限があります。鍵はブラウザに入っていません。通信は暗号化されています。人数は、一クラス二十五人で遅延五十ミリ秒、一つの世界に百人でも切断ゼロを実測しています。", "sec": 33.4, "at": 513.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/38c5980a0ed2e435.wav", "spoken": 32.09, "frames": 334}, {"chapter": "教室での運用", "fig": "island-willow", "title": "１か月の無料体験", "text": "一か月の無料体験をご用意しています。教室専用のクラスコードをお作りして、そのまま授業でお使いいただけます。記録もレポートも、体験中から本番と同じものが出ます。まずは先生方だけで一度触っていただくのが早いかと存じます。オンラインで画面をお見せしながらのご説明も、教室にお伺いしての設定も承ります。ご覧いただき、ありがとうございました。", "sec": 27.7, "at": 547.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/8cf68f26dcca86c0.wav", "spoken": 26.36, "frames": 277}], "five": [{"chapter": "はじめに", "fig": "island-willow", "title": "U-Speak ウェブ版", "text": "U-Speak ウェブ版へようこそ。子どもたちが英語を使って歩きまわる、３Ｄの世界です。実際の画面で、何ができるのかをご覧いただきます。", "sec": 13.2, "at": 0.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a8e1762928e3565c.wav", "spoken": 11.82, "frames": 132}, {"chapter": "はじめに", "fig": "screen-map", "title": "インストールも アカウントも いりません", "text": "ブラウザでＵＲＬを開き、名前とクラスコードを入れるだけ。インストールもアカウントもいりません。教室の iPad で、そのまま授業が始められます。", "sec": 12.5, "at": 13.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/10462d74ed4159a9.wav", "spoken": 11.17, "frames": 125}, {"chapter": "はじめに", "fig": "screen-map", "title": "１４の島", "text": "世界には１４の島があります。行き先を選んで飛ぶだけ。先生は、クラス全員を一度に同じ島へ動かせます。", "sec": 9.8, "at": 25.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/ae3a44c7b544c8c6.wav", "spoken": 8.41, "frames": 98}, {"chapter": "学習の島", "fig": "island-school", "title": "ことばの学校島", "text": "ことばの学校島です。やさしい小屋、ふつうの小屋、むずかしい小屋。小屋に入ることが、そのまま難易度を選ぶことになります。", "sec": 11.1, "at": 35.5, "wav": "/home/user/uspeak_meta/docs/.tour-voice/cc5ce9b759b8f6e8.wav", "spoken": 9.73, "frames": 111}, {"chapter": "学習の島", "fig": "screen-quiz", "title": "単語クイズ ・ １,５０１問", "text": "四択の単語クイズが十問。全部で千五百一問あります。問題文はブラウザに渡していません。答え合わせもサーバーが行うので、答えを先に見ることはできません。", "sec": 13.3, "at": 46.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/28885f6567b0c094.wav", "spoken": 11.9, "frames": 133}, {"chapter": "学習の島", "fig": "screen-battle", "title": "正解が、そのまま攻撃になる", "text": "えいごアリーナ島では、出題に正解した分だけ相手の体力が削れます。問題は二百四十九問。勝ち負けも、もらえるコインも、決めるのはサーバーです。", "sec": 12.7, "at": 59.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/db095e762f987d6b.wav", "spoken": 11.37, "frames": 127}, {"chapter": "英検の島", "fig": "island-eiken5", "title": "英検５級の島", "text": "Roblox 版にはなかった島です。英検の島。五級、四級、三級の三つがあり、建物がそのまま技能になっています。よむ、きく、かく、はなす。そして、めんせつの間。", "sec": 17.8, "at": 72.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/ccf17a51284eb2d1.wav", "spoken": 16.43, "frames": 178}, {"chapter": "英検の島", "fig": "screen-interview", "title": "めんせつの間 ・ 二次試験の練習", "text": "めんせつの間は、二次試験のかたちをそのままなぞります。カードを見て、音読して、質問に答える。面接官はキャラクターです。", "sec": 11.3, "at": 90.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/eca6f461fa8adb8f.wav", "spoken": 9.95, "frames": 113}, {"chapter": "AI英会話", "fig": "island-conv", "title": "英会話島", "text": "英会話島では、場所がそのまま場面になります。カフェ、おかいもの、がっこう、そして将来の夢。入った建物で話題が決まります。", "sec": 11.8, "at": 101.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/df0bd471443be5c2.wav", "spoken": 10.41, "frames": 118}, {"chapter": "AI英会話", "fig": "screen-convtalk", "title": "ウーピーと話す", "text": "相手はキャラクターのウーピー。声でも、打ち込んでもかまいません。返事は英語、ヒントは日本語。右の目標が話しながら埋まっていきます。話した文そのものは保護者レポートには載せません。", "sec": 14.7, "at": 113.5, "wav": "/home/user/uspeak_meta/docs/.tour-voice/22417916403494a2.wav", "spoken": 13.38, "frames": 147, "clip": "conv", "from": 12}, {"chapter": "AI英会話", "fig": "island-talk", "title": "おはなし島 ・ 人どうしが話す", "text": "おはなし島では、人どうしが顔を見て話せます。部屋に入ることが、そのまま通話に入ること。最大百人まで、朝の会や発表会にも使えます。", "sec": 12.7, "at": 128.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/7e495c4ea9d79deb.wav", "spoken": 11.39, "frames": 127}, {"chapter": "遊びの島", "fig": "screen-fishing", "title": "はじまりの島 ・ 英単語釣り", "text": "はじまりの島の釣りは、魚百種類。一匹が英単語一つで、釣り場も英検の級で分かれています。", "sec": 9.1, "at": 140.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/4abd029df537f07b.wav", "spoken": 7.78, "frames": 91}, {"chapter": "遊びの島", "fig": "screen-race", "title": "レース ・ ３周", "text": "のりもの島では、島のコースを三周するレース。順位もラップも判定はサーバーで、クラスの誰かと一緒に走れます。", "sec": 10.0, "at": 150.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a4eefff24e441ab1.wav", "spoken": 8.64, "frames": 100}, {"chapter": "遊びの島", "fig": "screen-blockshop", "title": "ブロック屋 ・ どれも英単語", "text": "ブロックはブロック屋で買います。き、いし、レンガ、ガラス、ランプ、みず。どれも名前が英単語です。", "sec": 10.0, "at": 160.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/00e4f71427fa471c.wav", "spoken": 8.61, "frames": 100}, {"chapter": "遊びの島", "fig": "screen-wearback", "title": "４１点 ・ ３Dで見てから買う", "text": "きせかえは全部で四十一点。カードの中で立体が回っていて、買う前にどう見えるかがわかります。着たものはクラス全員から見えます。", "sec": 10.8, "at": 170.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/b13bd1020bba4537.wav", "spoken": 9.45, "frames": 108}, {"chapter": "同梱ゲーム", "fig": "game-racers", "title": "AURORA KART", "text": "まったく別に作られたゲームも同梱しています。のりもの島の左下のボタンから、AURORA KART。コース四本、グランプリ、英語モード。", "sec": 13.2, "at": 180.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/2c6edc008652cd5e.wav", "spoken": 11.8, "frames": 132, "clip": "racers", "from": 21}, {"chapter": "同梱ゲーム", "fig": "game-blockwild", "title": "BLOCKWILD ・ ブロック屋とつながっている", "text": "まちづくり島からは BLOCKWILD。ここで手に持てるのは、ブロック屋でコインを払って買ったブロックだけです。英語をやってコインを稼ぐと、建てられるものが増えます。", "sec": 13.7, "at": 194.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/0326aafb1215ce04.wav", "spoken": 12.37, "frames": 137, "clip": "blockwild", "from": 32}, {"chapter": "同梱ゲーム", "fig": "game-suika", "title": "ミニゲーム島", "text": "ミニゲーム島には、ぷよとスイカゲーム。ただし、同梱の四本ではコインも学習記録も動きません。遊びの時間として置いてあります。", "sec": 10.9, "at": 207.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/56d998250dd03bb8.wav", "spoken": 9.54, "frames": 109}, {"chapter": "記録", "fig": "screen-dashboard", "title": "マイページ ・ ５技能", "text": "子ども自身が見るのがマイページ。読む、聞く、書く、話す、語彙の五技能を、やった量と正解率から出しています。", "sec": 10.8, "at": 218.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/e95ccff49304b2f3.wav", "spoken": 9.4, "frames": 108}, {"chapter": "記録", "fig": "report-page1", "title": "保護者レポート ・ A4 ２ページ", "text": "保護者さまへは、ボタン一つでこのＡ４二ページのＰＤＦが出ます。教室で刷って、そのままお渡しいただけます。", "sec": 9.9, "at": 229.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/34c275a9498d63f9.wav", "spoken": 8.55, "frames": 99}, {"chapter": "記録", "fig": "screen-quiz", "title": "正誤も、コインも、サーバーが決める", "text": "正誤、コイン、学習の記録、レベル、順位。これらは全部サーバーが決めています。ブラウザをいじってコインを増やす、正解率を上げる、といったことはできません。", "sec": 14.0, "at": 239.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/202759fef85fa14b.wav", "spoken": 12.66, "frames": 140}, {"chapter": "教室での運用", "fig": "screen-teacher", "title": "先生コンソール", "text": "先生コンソールは、講師キーを入れた方にだけ出ます。全員をここへ集める、その子のところへ飛ぶ、チャットを止める、レポートを配る。", "sec": 11.3, "at": 253.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/8e90fc72c11c72e6.wav", "spoken": 9.96, "frames": 113}, {"chapter": "教室での運用", "fig": "island-park", "title": "安全と、人数", "text": "世界の中にお金の入口はありません。チャットは定型文が基本で、先生がいつでも止められます。ＡＩ英会話と通話には一日の上限。人数は一クラス二十五人、一つの世界に百人まで実測しています。", "sec": 16.5, "at": 264.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/8e2ec982f86dfb74.wav", "spoken": 15.17, "frames": 165}, {"chapter": "教室での運用", "fig": "island-willow", "title": "１か月の無料体験", "text": "一か月の無料体験をご用意しています。教室専用のクラスコードをお作りして、そのまま授業でお使いいただけます。まずは先生方だけで一度触ってみてください。ご覧いただき、ありがとうございました。", "sec": 15.9, "at": 281.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/38bf14835caa44b3.wav", "spoken": 14.59, "frames": 159}]};
let cuts = DATA.full;
const $ = (id) => document.getElementById(id);
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function buildChapters() {
  $('chapters').replaceChildren(...cuts.map((c, n) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.innerHTML = `<em>${mmss(c.at)}</em><span>${c.title}</span>`;
    b.onclick = () => { $('v').currentTime = c.at + 0.05; follow(); $('v').play?.(); };
    li.append(b);
    return li;
  }));
}

// いま流れている場面を光らせる。動画の中の字幕と、下の一覧が同じところを指す。
function follow() {
  const t = $('v').currentTime;
  let i = 0;
  while (i + 1 < cuts.length && cuts[i + 1].at <= t) i += 1;
  $('now').textContent = `${cuts[i].chapter} ・ ${cuts[i].title}`;
  [...$('chapters').children].forEach((li, n) => li.firstChild.classList.toggle('now', n === i));
}

function setLength(which) {
  const five = which === 'five';
  cuts = five ? DATA.five : DATA.full;
  const src = five ? 'uspeak-tour-5min.mp4' : 'uspeak-tour-10min.mp4';
  $('v').src = src; $('dl').href = src;
  $('len10').classList.toggle('on', !five);
  $('len5').classList.toggle('on', five);
  buildChapters(); follow();
}
$('len10').onclick = () => setLength('full');
$('len5').onclick = () => setLength('five');
$('v').addEventListener('timeupdate', follow);

buildChapters(); follow();
</script></body></html>
