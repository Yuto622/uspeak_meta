<script>
const DATA = {"full": [{"chapter": "はじめに", "fig": "island-willow", "title": "U-Speak ウェブ版", "text": "U-Speak ウェブ版へようこそ。子どもたちが英語を使って歩きまわる、３Ｄの世界です。いま U-Speak Roblox をお使いの教室さまに向けて、何ができて、Roblox 版と何が違うのかを、実際の画面でご覧いただきます。", "sec": 23.3, "at": 0.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/90ecffbc11633ffe.wav", "spoken": 21.98, "frames": 233}, {"chapter": "はじめに", "fig": "guide-lobby", "title": "ユーザーネームと パスワードだけ", "text": "いちばん大きな違いは、はじめかたです。ブラウザで教室のＵＲＬを開き、ユーザーネームとパスワードを入れるだけ。アプリのインストールも、Roblox のアカウントもいりません。先生かどうかは名簿の先生の列でサーバーが決めるので、先生用の別のパスワードもありません。", "sec": 21.1, "at": 23.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/8ff6149d2c3d2595.wav", "spoken": 19.79, "frames": 211}, {"chapter": "はじめに", "fig": "tour-worlds", "title": "せかいを えらぼう ・ ２６の島", "text": "入るとすぐ、せかいを えらぼう の画面が出ます。島は全部で二十六。おすすめのカードを押すと、その島へ飛んで、代表の場所がそのまま開きます。英単語、ＡＢＣ、絵本、宿題、きせかえ、レース、つり、英検。歩いて探さなくても、押したらすぐ学習が始まります。", "sec": 24.5, "at": 44.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/30c99b053b7cca7e.wav", "spoken": 23.18, "frames": 245}, {"chapter": "はじめに", "fig": "tour-main", "title": "メインの島 ・ つぎに やること", "text": "メインの島がホームです。左上の「つぎに やること」が、今日やることを一つずつ出し、足もとから光の道が行き先まで案内します。先生が宿題を配ると、ここのいちばん上に宿題が来ます。下のバーの「せかいを えらぶ」で、いつでも島を選び直せます。", "sec": 22.2, "at": 68.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a02011866389f45b.wav", "spoken": 20.84, "frames": 222}, {"chapter": "はじめに", "fig": "main-wordhouse", "title": "英単語ハウス", "text": "メインの島の英単語ハウスは、Roblox 版の小屋と同じ問題です。スーパーイージーとイージーの二段階。釣り場、屋台、ふくや、ブロックや、いえのおみせも、この島に集まっています。", "sec": 16.5, "at": 91.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/30f1e26d4421ae79.wav", "spoken": 15.13, "frames": 165}, {"chapter": "学習の島", "fig": "island-school", "title": "ことばの学校島", "text": "ことばの学校島です。やさしい小屋、ふつうの小屋、むずかしい小屋。小屋に入ることが、そのまま難易度を選ぶことになります。", "sec": 11.1, "at": 107.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/cc5ce9b759b8f6e8.wav", "spoken": 9.73, "frames": 111}, {"chapter": "学習の島", "fig": "screen-quiz", "title": "単語クイズ ・ １,５０１問", "text": "中に入ると、四択の単語クイズが十問。全部で千五百一問あります。まちがえた問題は、あとでもう一度出てきます。大事なのは、この問題文がブラウザに渡っていないことです。子どもの画面に届くのは、いま出ている一問だけ。答え合わせもサーバーが行います。ページの中を覗いて答えを先に読むことはできません。", "sec": 24.7, "at": 118.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/c43f87af390e3766.wav", "spoken": 23.33, "frames": 247}, {"chapter": "学習の島", "fig": "screen-gym", "title": "ことばのジム ・ 聞いて、声に出す", "text": "同じ島のことばのジムでは、聞こえた英語を選び、自分でも声に出して言います。発音は端末のマイクで拾いますが、合っているかどうかを決めるのはサーバーです。", "sec": 12.4, "at": 143.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/9e7880392aa994d5.wav", "spoken": 11.1, "frames": 124}, {"chapter": "学習の島", "fig": "island-arena", "title": "えいごアリーナ島", "text": "えいごアリーナ島。ここでは、攻撃を英語で買います。", "sec": 6.0, "at": 155.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/c146de80dc2e9858.wav", "spoken": 4.23, "frames": 60}, {"chapter": "学習の島", "fig": "screen-battle", "title": "正解が、そのまま攻撃になる", "text": "出題に正解すると、その分だけ相手の体力が削れます。問題は二百四十九問。相手の強さは、入った台で決まります。勝ち負けも、もらえるコインも、決めるのはサーバーです。", "sec": 15.3, "at": 161.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/3974830a3be53646.wav", "spoken": 13.92, "frames": 153}, {"chapter": "学習の島", "fig": "tour-abc-letter", "title": "ＡＢＣと おと ・ もじの なまえと おと", "text": "ＡＢＣの島は、文字からはじめる子のための島です。一文字ずつ、なまえと、ことばの中で出るおと、つまりフォニックスを分けて聞かせます。エスの なまえは エス、おとは スー。合成の声では出せないおとは、専用の音で鳴らし、先生が自分の声で録音し直すこともできます。", "sec": 23.1, "at": 177.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/f953a5e428dbab7d.wav", "spoken": 21.8, "frames": 231}, {"chapter": "学習の島", "fig": "tour-abc-blend", "title": "おとを つなげて よむ", "text": "次は、おとをつなげて読む練習です。シュ、イ、プ、と一つずつ光りながら鳴り、つなげて ship。どの絵かを選びます。文字の段階から、短いことば、二文字のおと、さいごの e まで。八割できたら次へ進みます。", "sec": 20.3, "at": 200.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a3370a979685e4f9.wav", "spoken": 18.92, "frames": 203}, {"chapter": "えほんの島", "fig": "island-reading", "title": "よみもの島 ・ 英語の えほん", "text": "よみもの島です。島の図書館に入ると、英語の絵本の本だなが開きます。絵本は百二十冊、レベルは十二段階。本だなには、その子のいまのレベルの本と、ひとつ上のちょうせんの本が並びます。", "sec": 16.3, "at": 220.5, "wav": "/home/user/uspeak_meta/docs/.tour-voice/39b7f62fc2ce1442.wav", "spoken": 14.98, "frames": 163}, {"chapter": "えほんの島", "fig": "screen-reading", "title": "本だな ・ いまの レベルに ぴったり", "text": "レベルはロードマップの段階と同じです。読み終えた本には星がつき、読んだ冊数と語数が上に出ます。先生は、読ませたい本を宿題として、クラスや一人ひとりに配ることもできます。", "sec": 14.8, "at": 236.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/0a785d7a16c44470.wav", "spoken": 13.46, "frames": 148}, {"chapter": "えほんの島", "fig": "screen-reading-book", "title": "きく ・ よむ ・ こえに出す ・ クイズ", "text": "一冊ずつ、まず英語を聞きます。読み上げに合わせて、ことばが光ります。次に自分で読み、ことばを押すと発音と意味が出ます。声に出して読むと、正確さと読む速さをサーバーが測ります。最後に内容のクイズ。絵は、サーバーがその場で描いています。", "sec": 20.3, "at": 251.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/e2dc8c8b1c65d0a7.wav", "spoken": 19.0, "frames": 203}, {"chapter": "学習の島", "fig": "tour-homework-admin", "title": "しゅくだい島", "text": "しゅくだい島では、先生が配った宿題を、七つのゲームの形で解きます。えらぶ、つづる、きいてえらぶ、タイピング、せんつなぎ、ならべかえ、あなうめ。答え合わせはサーバーです。", "sec": 15.8, "at": 271.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/7e2154fe86a04d59.wav", "spoken": 14.49, "frames": 158}, {"chapter": "英検", "fig": "island-eiken5", "title": "英検５級の島", "text": "Roblox 版にはなかった島です。英検の島。五級、四級、三級の三つがあり、建物がそのまま技能になっています。よむ図書館、きく音楽堂、かく工房、はなすステージ。そして、めんせつの間。", "sec": 19.5, "at": 287.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/260797df2e950657.wav", "spoken": 18.16, "frames": 195}, {"chapter": "英検", "fig": "screen-eiken", "title": "４技能を、級ごとに", "text": "一つの級につき四十四問。読む十問、聞く十二問、書く十二問、話す十問です。記録は級ごと、技能ごとに分かれて残るので、五級の聞くは九割、書くは六割、という細かさで見られます。", "sec": 17.2, "at": 307.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/43adfb255cfc9891.wav", "spoken": 15.81, "frames": 172}, {"chapter": "英検", "fig": "tour-interview", "title": "めんせつの間 ・ 面接官は ゆぴちゃん", "text": "めんせつの間は、二次試験のかたちをそのままなぞります。面接官は、このピンク色のキャラクター、ゆぴちゃんです。カードを見て、パッセージを音読し、質問に答え、最後に自分のことを聞かれる。五級から一級まで、級ごとの面接の形に合わせてあります。", "sec": 20.8, "at": 324.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/1c5df9d7f5c348f7.wav", "spoken": 19.43, "frames": 208}, {"chapter": "英検", "fig": "tour-quick", "title": "きょうの ５ふん", "text": "時間がない日は、きょうの五ふん。英検の読む三問と聞く二問を、どこからでも開けます。級はその子に合わせてサーバーが選びます。", "sec": 10.6, "at": 345.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/0c2840b3eecd3282.wav", "spoken": 9.29, "frames": 106}, {"chapter": "AI英会話", "fig": "island-conv", "title": "英会話島", "text": "英会話島では、場所がそのまま場面になります。であいのカフェ、おかいものストリート、がっこうテラス、ゆめのとうだい。入った建物で、話す話題が決まります。", "sec": 13.5, "at": 355.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/84b9b49cc549f137.wav", "spoken": 12.14, "frames": 135}, {"chapter": "AI英会話", "fig": "tour-conv", "title": "ゆぴちゃんと 話す", "text": "相手はゆぴちゃん。まんなかの大きなマイクを押して、声で話します。返事は英語で、ゆぴちゃんが口を動かして話し、ヒントは日本語で出ます。右側の目標が、話しながら一つずつ埋まっていきます。会話中はまちがいを直さず、最後に、もっとよい言い方をまとめて見せます。", "sec": 21.4, "at": 369.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/d9398d4b01b22a96.wav", "spoken": 20.05, "frames": 214, "clip": "conv", "from": 32}, {"chapter": "AI英会話", "fig": "island-errand", "title": "おつかい島 ・ 歩いて回るAI英会話", "text": "おつかい島では、同じAI英会話を歩いて回ります。広場で用事を受け取り、その店まで自分で歩いて行って、英語で用事をすませる。店は十か所、おつかいは十五件です。", "sec": 14.4, "at": 390.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/bacf91bda06fad2d.wav", "spoken": 13.05, "frames": 144}, {"chapter": "AI英会話", "fig": "island-talk", "title": "みんなで はなす しま ・ ビデオ通話", "text": "みんなで はなす しまは、AIではなく人どうしが話す島です。部屋に入ることが、そのまま通話に入ること。カメラとマイクはそれぞれ切れますし、文字でも書けるので、声を出しにくい子も参加できます。最大百人まで。朝の会や発表会にもお使いいただけます。", "sec": 21.5, "at": 405.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a4c26174de6d9b54.wav", "spoken": 20.2, "frames": 215}, {"chapter": "遊びの島", "fig": "screen-fishing", "title": "はじまりの島 ・ 英単語釣り", "text": "はじまりの島には、釣りがあります。魚は百種類。一匹が英単語一つになっていて、釣り場も英検の級で分かれています。釣ること自体が、そのまま単語の練習です。", "sec": 14.3, "at": 426.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/f8b82f313d3725c7.wav", "spoken": 12.92, "frames": 143}, {"chapter": "遊びの島", "fig": "screen-fw-mc", "title": "つり島 ・ ７つの 問題の形", "text": "つり島は、池、川、海が、英検の五級、四級、三級に分かれています。水辺に立つと、すぐさおを投げます。うきが沈んだら問題。選ぶ、つづる、打つ、線でつなぐなど、七つの形で出て、正解するとタイミングよく釣り上げます。釣った魚は図鑑に残ります。", "sec": 23.9, "at": 440.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/b34d008ac13f8306.wav", "spoken": 22.57, "frames": 239}, {"chapter": "遊びの島", "fig": "island-farm", "title": "ぼくじょう島", "text": "ぼくじょう島は、体力のかわりに英語を払う牧場です。たねを買う、水をやる、エサをやる。どれも英語の一問に答えるとできます。季節も、天気も、おまつりも、サーバーの暦で動きます。", "sec": 16.1, "at": 464.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/ab3b8ed9563031ea.wav", "spoken": 14.8, "frames": 161}, {"chapter": "遊びの島", "fig": "island-pet", "title": "ペット島", "text": "ペット島でたまごを育てると、ペットがいつも横を歩くようになります。となりの子のペットも見えます。", "sec": 8.2, "at": 480.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/f90f4db298207349.wav", "spoken": 6.87, "frames": 82}, {"chapter": "遊びの島", "fig": "island-ride", "title": "のりもの島", "text": "のりもの島。乗り物は四台あり、買えるのはその乗り物のゲートまで歩いて行ったときだけです。買うと、その乗り物の英単語を一つ覚えます。", "sec": 11.4, "at": 489.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/540da057c826bd14.wav", "spoken": 10.1, "frames": 114}, {"chapter": "遊びの島", "fig": "screen-race", "title": "レース ・ ３周", "text": "スタートラインに立つと、島のコースを三周するレースが始まります。順位もラップもベストタイムも、判定はサーバーです。クラスの誰かと一緒に走れます。", "sec": 12.5, "at": 500.5, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a442392aa566c0ce.wav", "spoken": 11.13, "frames": 125}, {"chapter": "遊びの島", "fig": "tour-kart", "title": "レース ・ ことばの レーンを 走る", "text": "のりもの島のレースは、Roblox 版と同じ問題の形です。上に日本語、前に英語のレーンが三本。正しいことばのレーンを車で走り抜けます。出題と判定はサーバーで、正解はコインと学習の記録になります。", "sec": 18.5, "at": 513.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/132b38743da41967.wav", "spoken": 17.14, "frames": 185}, {"chapter": "遊びの島", "fig": "island-town", "title": "まちづくり島", "text": "まちづくり島は、ブロックを買って建てる島です。建てる場所は二つ。自分だけのマイルームと、クラス全員で一つの世界を作るひろば。", "sec": 11.3, "at": 531.5, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a60e5feb575fb861.wav", "spoken": 9.93, "frames": 113}, {"chapter": "遊びの島", "fig": "screen-plaza", "title": "ひろば ・ クラス全員で一つの世界", "text": "入口に歩いて入るだけで、中に入れます。画面中央の十字でねらって、置く、かたづける、向きを変える。ひろばに積んだブロックは他の子の画面にもその場で現れ、次の授業にも残っています。", "sec": 15.8, "at": 542.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/5fd5763de0747f58.wav", "spoken": 14.43, "frames": 158}, {"chapter": "遊びの島", "fig": "screen-blockshop", "title": "ブロック屋 ・ どれも英単語", "text": "ブロックはブロック屋で買います。き、いし、レンガ、ガラス、ランプ、みず。どれも名前が英単語です。買う前に、立体のかたちと質感でどんなブロックかが見えます。", "sec": 14.4, "at": 558.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/6454cabb0f18aff6.wav", "spoken": 13.02, "frames": 144}, {"chapter": "遊びの島", "fig": "island-land", "title": "土地島 ・ じぶんだけの しま", "text": "土地島では、コインで自分だけの島を買い、大きくしていけます。友だちの島へ船で遊びに行くこともできます。", "sec": 9.4, "at": 573.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/59437770089615d2.wav", "spoken": 8.05, "frames": 94}, {"chapter": "遊びの島", "fig": "island-wear", "title": "きせかえ島", "text": "きせかえ島。ぼうしや、めがねや、かばんや、アクセサリーや。入った店が、そのまま買えるものになります。", "sec": 9.8, "at": 582.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/126d27d695390530.wav", "spoken": 8.5, "frames": 98}, {"chapter": "遊びの島", "fig": "tour-avatar", "title": "きせかえ ・ すがたも 買える", "text": "きせかえは、ぼうし、めがね、かばん、アクセサリー、そして、すがた。ねこ、パンダ、にんじゃ、ドラゴンなど八つのすがたを、コインで買って着替えられます。着たものは、クラス全員の画面に届きます。", "sec": 17.4, "at": 592.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/15b80906515cd07e.wav", "spoken": 16.04, "frames": 174}, {"chapter": "遊びの島", "fig": "island-park", "title": "テーマパーク", "text": "テーマパークには、メリーゴーランド、かんらんしゃ、ジェットコースター。乗るたびにコインを使います。英語でかせいだコインの使い道です。", "sec": 10.8, "at": 609.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/0dfce36dbb97253f.wav", "spoken": 9.47, "frames": 108}, {"chapter": "同梱ゲーム", "fig": "game-racers", "title": "AURORA KART ・ BLOCKWILD", "text": "ここからは、別に作られたゲームです。AURORA KART はコース四本の本格的なカートレース。BLOCKWILD はブロックを積んで世界を作るゲームで、手に持てるのは、ブロック屋で U-Speak コインを払って買ったブロックだけ。英語をやってコインを稼ぐと、建てられるものが増えます。", "sec": 25.6, "at": 620.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/344bfda5ba4fcf3a.wav", "spoken": 24.27, "frames": 256, "clip": "racers", "from": 21}, {"chapter": "同梱ゲーム", "fig": "game-blockwild", "title": "BLOCKWILD ・ ブロック屋とつながっている", "text": "まちづくり島からは BLOCKWILD。ブロックを積んで世界を作るゲームです。ここが面白いところで、この世界で手に持てるのは、まちづくり島のブロック屋で U-Speak コインを払って買ったブロックだけ。写真の下のバーに、き しか入っていないのは、この子がまだ何も買っていないからです。英語をやってコインを稼ぐと、建てられるものが増えます。", "sec": 28.3, "at": 646.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/1a647e3908327161.wav", "spoken": 26.97, "frames": 283, "clip": "blockwild", "from": 32}, {"chapter": "同梱ゲーム", "fig": "game-suika", "title": "ミニゲーム島", "text": "ミニゲーム島には家が二軒。ぷよと、スイカゲーム。どちらも英単語を使ったパズルです。なお、この四本の同梱ゲームでは、コインも学習の記録も動きません。正誤を判定しているのがそのゲーム自身だからです。遊びの時間として置いてあります。", "sec": 19.0, "at": 674.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/73252deae98dfbfd.wav", "spoken": 17.66, "frames": 190}, {"chapter": "記録", "fig": "screen-dashboard", "title": "マイページ ・ ５技能", "text": "ここからは記録の話です。子ども自身が見るのがマイページ。読む、聞く、書く、話す、語彙の五技能を、やった量と正解率から出しています。", "sec": 12.9, "at": 693.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/c0cc1b97c1bd90e0.wav", "spoken": 11.59, "frames": 129}, {"chapter": "記録", "fig": "tour-roadmap", "title": "ロードマップ ・ １２の 段階", "text": "ロードマップは、Ａ、Ｂ、Ｃと、一から九の十二段階です。英検ジュニアから準一級まで。その段階の単語を八割覚えて、クイズの正解率が八割になると、サーバーが次の段階に上げます。英検の合格見込みと、あと何問で届くかも出ます。", "sec": 20.6, "at": 706.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/b9208006f8540de8.wav", "spoken": 19.27, "frames": 206}, {"chapter": "記録", "fig": "tour-rank", "title": "ランキング ・ じぶんくらべ", "text": "ランキングは、いちばん上がじぶんくらべです。先週より何ＸＰ伸びたか、クラスみんなで目標までどこまで来たか。下がったことは見せません。順位で落ちこむ子を作らないための形です。", "sec": 14.6, "at": 726.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/d323a2086a6b474e.wav", "spoken": 13.23, "frames": 146}, {"chapter": "記録", "fig": "screen-review", "title": "苦手単語の 復習", "text": "まちがえた単語は、一日後、三日後、七日後と、間をあけて出てきます。Roblox 版でまちがえた単語も、同じ箱に入ります。", "sec": 12.9, "at": 741.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/d46ca0fb09b5d517.wav", "spoken": 11.6, "frames": 129}, {"chapter": "記録", "fig": "report-page1", "title": "保護者レポート ・ A4 ２ページ", "text": "保護者さまへは、先生コンソールのボタン一つで、このＡ４二ページのＰＤＦが出ます。名前、レベル、正解率、やったことの棒グラフ。教室で刷って、そのままお渡しいただけます。", "sec": 16.2, "at": 754.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/51828c67bdd383fd.wav", "spoken": 14.81, "frames": 162}, {"chapter": "記録", "fig": "report-page2", "title": "数字は だれが決めているか", "text": "二ページ目には、全部の記録と、つぎのもくひょう。そして、この数字がどこから来たのかの説明が入ります。書いた文や話した内容は載せません。載せるのは学習の記録だけです。", "sec": 14.6, "at": 770.5, "wav": "/home/user/uspeak_meta/docs/.tour-voice/3b3ac47d7b76b085.wav", "spoken": 13.3, "frames": 146}, {"chapter": "記録", "fig": "screen-quiz", "title": "正誤も、コインも、サーバーが決める", "text": "大切な点を一つ。子どもの端末が決めているのは、どこに立っているか、どちらを向いているか、それだけです。正誤、経験値、コイン、購入、持ち物、学習の記録、レベル、順位、先生かどうか。これらは全部サーバーが決めています。保護者さまにお見せする数字は、すべてこちら側から出ています。ブラウザをいじってコインを増やす、正解率を上げる、といったことはできません。", "sec": 31.0, "at": 785.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/cb7a2f1c82796663.wav", "spoken": 29.61, "frames": 310}, {"chapter": "教室での運用", "fig": "screen-teacher", "title": "先生コンソール", "text": "先生コンソールは、名簿で先生の列に印がある方にだけ出ます。判定はサーバー側だけで行うので、ブラウザをいじって先生になることはできません。クラス全員をここへ集める、名簿からその子のところへ飛ぶ、チャットを止める、保護者レポートのリンクを配る。授業中に必要なことが、この一枚に集まっています。", "sec": 23.9, "at": 816.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/b6398cfdc5681d88.wav", "spoken": 22.57, "frames": 239}, {"chapter": "教室での運用", "fig": "screen-classmode", "title": "授業モード", "text": "授業モードでは、先生のボタン一つで、全員を集める、全員を止める、苦手単語の復習を一斉に出す、全員で同じ島へ動く、ができます。", "sec": 12.7, "at": 840.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/252117662efb4251.wav", "spoken": 11.35, "frames": 127}, {"chapter": "教室での運用", "fig": "tour-homework-admin", "title": "宿題を くばる ・ ３ステップ", "text": "宿題は、プリントの写真、ＰＤＦ、ワード、エクセル、ＣＳＶを入れるだけ。ＡＩが問題に読みとり、先生がたしかめてから配ります。配るまでは子どもには出ません。絵本を一冊、宿題として配ることもできます。結果は保護者レポートに載ります。", "sec": 20.7, "at": 852.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/09425018be52d656.wav", "spoken": 19.35, "frames": 207}, {"chapter": "教室での運用", "fig": "tour-phonics-admin", "title": "フォニックスの おとを 録音", "text": "フォニックスのおとは、運営の画面で、先生の声に一つずつ録り直せます。録った声は、全部の教室の、ＡＢＣの島で鳴ります。", "sec": 11.9, "at": 873.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/de85c27b4ce432f8.wav", "spoken": 10.53, "frames": 119}, {"chapter": "教室での運用", "fig": "island-park", "title": "安全と、人数", "text": "安全についても申し上げておきます。世界の中にお金の入口はありません。Robux にあたるものは作っていません。チャットは定型フレーズが基本で、自由入力もＮＧワード表を通り、先生がいつでも止められます。ＡＩ英会話とビデオ通話には一日の上限があります。鍵はブラウザに入っていません。通信は暗号化されています。人数は、一クラス二十五人で遅延五十ミリ秒、一つの世界に百人でも切断ゼロを実測しています。", "sec": 33.4, "at": 885.3, "wav": "/home/user/uspeak_meta/docs/.tour-voice/38c5980a0ed2e435.wav", "spoken": 32.09, "frames": 334}, {"chapter": "教室での運用", "fig": "island-willow", "title": "１か月の無料体験", "text": "一か月の無料体験をご用意しています。教室専用のクラスとパスワードをお作りして、そのまま授業でお使いいただけます。記録もレポートも、体験中から本番と同じものが出ます。まずは先生方だけで一度触っていただくのが早いかと存じます。オンラインで画面をお見せしながらのご説明も、教室にお伺いしての設定も承ります。ご覧いただき、ありがとうございました。", "sec": 28.1, "at": 918.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/63503bbf047f7096.wav", "spoken": 26.73, "frames": 281}], "five": [{"chapter": "はじめに", "fig": "island-willow", "title": "U-Speak ウェブ版", "text": "U-Speak ウェブ版へようこそ。子どもたちが英語を使って歩きまわる、３Ｄの世界です。実際の画面で、何ができるのかをご覧いただきます。", "sec": 13.2, "at": 0.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a8e1762928e3565c.wav", "spoken": 11.82, "frames": 132}, {"chapter": "はじめに", "fig": "guide-lobby", "title": "ユーザーネームと パスワードだけ", "text": "ブラウザでＵＲＬを開き、ユーザーネームとパスワードを入れるだけ。インストールも Roblox のアカウントもいりません。", "sec": 10.4, "at": 13.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/0668d215fa0099a7.wav", "spoken": 9.09, "frames": 104}, {"chapter": "はじめに", "fig": "tour-worlds", "title": "せかいを えらぼう ・ ２６の島", "text": "入るとすぐ、せかいを えらぼう の画面。島は二十六。カードを押すと、その島の代表の場所がそのまま開きます。", "sec": 10.9, "at": 23.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/b1ec65aed34bd67c.wav", "spoken": 9.6, "frames": 109}, {"chapter": "はじめに", "fig": "tour-main", "title": "メインの島 ・ つぎに やること", "text": "ホームはメインの島。左上の「つぎに やること」と光の道が、今日やることへ案内します。宿題が出ると、ここのいちばん上に来ます。", "sec": 12.5, "at": 34.5, "wav": "/home/user/uspeak_meta/docs/.tour-voice/689596f700bc4622.wav", "spoken": 11.18, "frames": 125}, {"chapter": "学習の島", "fig": "island-school", "title": "ことばの学校島", "text": "ことばの学校島です。やさしい小屋、ふつうの小屋、むずかしい小屋。小屋に入ることが、そのまま難易度を選ぶことになります。", "sec": 11.1, "at": 47.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/cc5ce9b759b8f6e8.wav", "spoken": 9.73, "frames": 111}, {"chapter": "学習の島", "fig": "screen-quiz", "title": "単語クイズ ・ １,５０１問", "text": "四択の単語クイズが十問。全部で千五百一問あります。問題文はブラウザに渡していません。答え合わせもサーバーが行うので、答えを先に見ることはできません。", "sec": 13.3, "at": 58.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/28885f6567b0c094.wav", "spoken": 11.9, "frames": 133}, {"chapter": "学習の島", "fig": "screen-battle", "title": "正解が、そのまま攻撃になる", "text": "えいごアリーナ島では、出題に正解した分だけ相手の体力が削れます。問題は二百四十九問。勝ち負けも、もらえるコインも、決めるのはサーバーです。", "sec": 12.7, "at": 71.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/db095e762f987d6b.wav", "spoken": 11.37, "frames": 127}, {"chapter": "学習の島", "fig": "tour-abc-letter", "title": "ＡＢＣと おと ・ もじの なまえと おと", "text": "ＡＢＣの島では、文字のなまえと、ことばの中のおと、フォニックスを分けて聞かせます。", "sec": 8.0, "at": 84.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/f94831ffdc7dc400.wav", "spoken": 6.61, "frames": 80}, {"chapter": "学習の島", "fig": "tour-abc-blend", "title": "おとを つなげて よむ", "text": "シュ、イ、プ、とおとが光りながら鳴り、つなげて ship。おとから読む力をつけます。", "sec": 9.1, "at": 92.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/b3ad69965fec16b0.wav", "spoken": 7.71, "frames": 91}, {"chapter": "えほんの島", "fig": "island-reading", "title": "よみもの島 ・ 英語の えほん", "text": "よみもの島です。図書館に入ると、英語の絵本の本だなが開きます。百二十冊、十二段階。その子のいまのレベルの本が並びます。", "sec": 11.9, "at": 101.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/e53167e37daf2710.wav", "spoken": 10.55, "frames": 119}, {"chapter": "えほんの島", "fig": "screen-reading-book", "title": "きく ・ よむ ・ こえに出す ・ クイズ", "text": "まず聞いて、自分で読み、声に出して読み、最後にクイズ。ことばを押すと、発音と意味が出ます。絵は、サーバーがその場で描いています。", "sec": 12.1, "at": 113.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/4531d3327cec3ca9.wav", "spoken": 10.78, "frames": 121}, {"chapter": "英検", "fig": "island-eiken5", "title": "英検５級の島", "text": "Roblox 版にはなかった島です。英検の島。五級、四級、三級の三つがあり、建物がそのまま技能になっています。よむ、きく、かく、はなす。そして、めんせつの間。", "sec": 17.8, "at": 125.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/ccf17a51284eb2d1.wav", "spoken": 16.43, "frames": 178}, {"chapter": "英検", "fig": "tour-interview", "title": "めんせつの間 ・ 面接官は ゆぴちゃん", "text": "めんせつの間の面接官は、ピンク色のゆぴちゃん。カードを見て、音読して、質問に答える。五級から一級まで、本番の形です。", "sec": 12.0, "at": 143.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/2d4fd47b24aae937.wav", "spoken": 10.63, "frames": 120}, {"chapter": "AI英会話", "fig": "island-conv", "title": "英会話島", "text": "英会話島では、場所がそのまま場面になります。カフェ、おかいもの、がっこう、そして将来の夢。入った建物で話題が決まります。", "sec": 11.8, "at": 155.0, "wav": "/home/user/uspeak_meta/docs/.tour-voice/df0bd471443be5c2.wav", "spoken": 10.41, "frames": 118}, {"chapter": "AI英会話", "fig": "tour-conv", "title": "ゆぴちゃんと 話す", "text": "相手はピンク色のゆぴちゃん。マイクを押して声で話すと、ゆぴちゃんが英語で返します。右の目標が、話しながら埋まっていきます。", "sec": 10.6, "at": 166.8, "wav": "/home/user/uspeak_meta/docs/.tour-voice/6e1f0c9933789d2d.wav", "spoken": 9.29, "frames": 106, "clip": "conv", "from": 32}, {"chapter": "AI英会話", "fig": "island-talk", "title": "みんなで はなす しま ・ ビデオ通話", "text": "みんなで はなす しまでは、人どうしが顔を見て話せます。部屋に入ることが、そのまま通話に入ること。最大百人まで、朝の会や発表会にも使えます。", "sec": 14.2, "at": 177.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/dea1a54a24f0749c.wav", "spoken": 12.9, "frames": 142}, {"chapter": "遊びの島", "fig": "screen-fishing", "title": "はじまりの島 ・ 英単語釣り", "text": "はじまりの島の釣りは、魚百種類。一匹が英単語一つで、釣り場も英検の級で分かれています。", "sec": 9.1, "at": 191.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/4abd029df537f07b.wav", "spoken": 7.78, "frames": 91}, {"chapter": "遊びの島", "fig": "screen-fw-mc", "title": "つり島 ・ ７つの 問題の形", "text": "つり島は池、川、海が英検の級に分かれています。問題に正解すると、魚が釣れて図鑑に残ります。", "sec": 10.0, "at": 200.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/6f9c08fa93555aac.wav", "spoken": 8.63, "frames": 100}, {"chapter": "遊びの島", "fig": "tour-kart", "title": "レース ・ ことばの レーンを 走る", "text": "レースは Roblox 版と同じ形。日本語を見て、正しい英語のレーンを車で走り抜けます。正解はコインと学習記録になります。", "sec": 12.7, "at": 210.7, "wav": "/home/user/uspeak_meta/docs/.tour-voice/3531af1ba3e788f4.wav", "spoken": 11.38, "frames": 127}, {"chapter": "遊びの島", "fig": "screen-blockshop", "title": "ブロック屋 ・ どれも英単語", "text": "ブロックはブロック屋で買います。き、いし、レンガ、ガラス、ランプ、みず。どれも名前が英単語です。", "sec": 10.0, "at": 223.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/00e4f71427fa471c.wav", "spoken": 8.61, "frames": 100}, {"chapter": "遊びの島", "fig": "tour-avatar", "title": "きせかえ ・ すがたも 買える", "text": "きせかえでは、ぼうしやめがねに加えて、ドラゴンやパンダなどのすがたもコインで買えます。着たものはクラス全員から見えます。", "sec": 9.8, "at": 233.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/9da251d15a45fc9f.wav", "spoken": 8.45, "frames": 98}, {"chapter": "同梱ゲーム", "fig": "game-racers", "title": "AURORA KART ・ BLOCKWILD", "text": "同梱ゲームも遊べます。BLOCKWILD で使えるのは、U-Speak コインで買ったブロックだけ。英語をやるほど建てられるものが増えます。", "sec": 13.3, "at": 243.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/8ac70f4de653454b.wav", "spoken": 11.9, "frames": 133, "clip": "racers", "from": 21}, {"chapter": "同梱ゲーム", "fig": "game-suika", "title": "ミニゲーム島", "text": "ミニゲーム島には、ぷよとスイカゲーム。ただし、同梱の四本ではコインも学習記録も動きません。遊びの時間として置いてあります。", "sec": 10.9, "at": 256.5, "wav": "/home/user/uspeak_meta/docs/.tour-voice/56d998250dd03bb8.wav", "spoken": 9.54, "frames": 109}, {"chapter": "記録", "fig": "screen-dashboard", "title": "マイページ ・ ５技能", "text": "子ども自身が見るのがマイページ。読む、聞く、書く、話す、語彙の五技能を、やった量と正解率から出しています。", "sec": 10.8, "at": 267.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/e95ccff49304b2f3.wav", "spoken": 9.4, "frames": 108}, {"chapter": "記録", "fig": "tour-roadmap", "title": "ロードマップ ・ １２の 段階", "text": "ロードマップは十二段階。単語とクイズが八割になると、サーバーが次の段階に上げます。英検の合格見込みも出ます。", "sec": 10.3, "at": 278.2, "wav": "/home/user/uspeak_meta/docs/.tour-voice/082b84ae1fcb19f9.wav", "spoken": 8.96, "frames": 103}, {"chapter": "記録", "fig": "report-page1", "title": "保護者レポート ・ A4 ２ページ", "text": "保護者さまへは、ボタン一つでこのＡ４二ページのＰＤＦが出ます。教室で刷って、そのままお渡しいただけます。", "sec": 9.9, "at": 288.5, "wav": "/home/user/uspeak_meta/docs/.tour-voice/34c275a9498d63f9.wav", "spoken": 8.55, "frames": 99}, {"chapter": "記録", "fig": "screen-quiz", "title": "正誤も、コインも、サーバーが決める", "text": "正誤、コイン、学習の記録、レベル、順位。これらは全部サーバーが決めています。ブラウザをいじってコインを増やす、正解率を上げる、といったことはできません。", "sec": 14.0, "at": 298.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/202759fef85fa14b.wav", "spoken": 12.66, "frames": 140}, {"chapter": "教室での運用", "fig": "screen-teacher", "title": "先生コンソール", "text": "先生コンソールは、名簿で先生の列に印がある方にだけ出ます。全員をここへ集める、その子のところへ飛ぶ、チャットを止める、レポートを配る。", "sec": 12.5, "at": 312.4, "wav": "/home/user/uspeak_meta/docs/.tour-voice/a46a46e67ae82703.wav", "spoken": 11.16, "frames": 125}, {"chapter": "教室での運用", "fig": "tour-homework-admin", "title": "宿題を くばる ・ ３ステップ", "text": "宿題はプリントの写真やファイルを入れるだけ。ＡＩが読みとり、先生がたしかめてから配ります。結果は保護者レポートへ。", "sec": 10.2, "at": 324.9, "wav": "/home/user/uspeak_meta/docs/.tour-voice/4fde1b0fa9a58cbc.wav", "spoken": 8.8, "frames": 102}, {"chapter": "教室での運用", "fig": "island-park", "title": "安全と、人数", "text": "世界の中にお金の入口はありません。チャットは定型文が基本で、先生がいつでも止められます。ＡＩ英会話と通話には一日の上限。人数は一クラス二十五人、一つの世界に百人まで実測しています。", "sec": 16.5, "at": 335.1, "wav": "/home/user/uspeak_meta/docs/.tour-voice/8e2ec982f86dfb74.wav", "spoken": 15.17, "frames": 165}, {"chapter": "教室での運用", "fig": "island-willow", "title": "１か月の無料体験", "text": "一か月の無料体験をご用意しています。教室専用のクラスとパスワードをお作りして、そのまま授業でお使いいただけます。まずは先生方だけで一度触ってみてください。ご覧いただき、ありがとうございました。", "sec": 16.3, "at": 351.6, "wav": "/home/user/uspeak_meta/docs/.tour-voice/1655fda913056549.wav", "spoken": 14.95, "frames": 163}]};
let cuts = DATA.full;
const $ = (id) => document.getElementById(id);
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function buildChapters() {
  $('chapters').replaceChildren(...cuts.map((c, n) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.innerHTML = `<em>${mmss(c.at)}</em><span>${c.title}</span>`;
    b.onclick = () => { $('v').currentTime = c.at + 0.05; follow(); $('v').play?.(); };
    li.append(b);
    return li;
  }));
}

// いま流れている場面を光らせる。動画の中の字幕と、下の一覧が同じところを指す。
function follow() {
  const t = $('v').currentTime;
  let i = 0;
  while (i + 1 < cuts.length && cuts[i + 1].at <= t) i += 1;
  $('now').textContent = `${cuts[i].chapter} ・ ${cuts[i].title}`;
  [...$('chapters').children].forEach((li, n) => li.firstChild.classList.toggle('now', n === i));
}

function setLength(which) {
  const five = which === 'five';
  cuts = five ? DATA.five : DATA.full;
  const src = five ? 'uspeak-tour-5min.mp4' : 'uspeak-tour-10min.mp4';
  $('v').src = src; $('dl').href = src;
  $('len10').classList.toggle('on', !five);
  $('len5').classList.toggle('on', five);
  buildChapters(); follow();
}
$('len10').onclick = () => setLength('full');
$('len5').onclick = () => setLength('five');
$('v').addEventListener('timeupdate', follow);

buildChapters(); follow();
</script></body></html>
